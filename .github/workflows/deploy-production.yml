name: Deploy prebuilt production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
     runs-on: [self-hosted, Linux, X64, production, asset-frontend]
    env:
      # Replace this with the Linux production server IPv4 address.
      SERVER_HOST: 20.193.139.63
      DEPLOY_ROOT: /var/www/asset-frontend
      PM2_APP_NAME: asset-frontend
      HEALTH_URL: http://127.0.0.1:3005/
      APP_KIND: frontend
      REQUIRE_KEYS: false
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

    steps:
      - name: Check deployment settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo 'Set SERVER_HOST in this workflow to the Linux server IPv4 address.'; exit 1; }
          [[ -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Configure DEPLOY_SSH_USER, DEPLOY_SSH_PRIVATE_KEY, and DEPLOY_SSH_KNOWN_HOSTS repository secrets.'; exit 1; }

      - name: Check out prebuilt output only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /exported/**
            !/exported/node_modules/**
            !/exported/.env
            !/exported/keys/**
            !/exported/uploads/**
            !/exported/.next/cache/**

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > $HOME/.ssh/production_key
          chmod 600 $HOME/.ssh/production_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          SSH=(ssh -i $HOME/.ssh/production_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts)
          "${SSH[@]}" "$SSH_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_ROOT/releases/$RELEASE_ID'"
          rsync -az --delete \
            --exclude='.env' --exclude='node_modules/' --exclude='uploads/' --exclude='keys/' --exclude='.next/cache/' \
            -e "ssh -i $HOME/.ssh/production_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            exported/ "$SSH_USER@$SERVER_HOST:$DEPLOY_ROOT/releases/$RELEASE_ID/"
          printf '%s\n' "$RELEASE_ID" > "$RUNNER_TEMP/release-id"

      - name: Activate and verify, or roll back
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(cat "$RUNNER_TEMP/release-id")"
          REMOTE_ARGS="$(python3 -c 'import shlex,sys; print(" ".join(shlex.quote(v) for v in sys.argv[1:]))' \
            "$DEPLOY_ROOT" "$RELEASE_ID" "$PM2_APP_NAME" "$HEALTH_URL" "$APP_KIND" "$REQUIRE_KEYS")"
          ssh -i $HOME/.ssh/production_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            "$SSH_USER@$SERVER_HOST" "bash -s -- $REMOTE_ARGS" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          root="$1"; release_id="$2"; app_name="$3"; health_url="$4"; app_kind="$5"; require_keys="$6"
          [[ "$root" == /* && "$root" != / && "$root" != *'..'* ]] || { echo 'DEPLOY_ROOT must be a safe absolute path.'; exit 1; }
          [[ "$app_name" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo 'Invalid PM2 app name.'; exit 1; }
          release="$root/releases/$release_id"
          shared="$root/shared"
          previous="$(readlink -f "$root/current" 2>/dev/null || true)"
          [[ -d "$release" ]] || { echo 'Uploaded release directory is missing.'; exit 1; }
          [[ -f "$shared/.env" ]] || { echo "Create the server-managed environment file at $shared/.env before deploying."; exit 1; }
          mkdir -p "$shared/uploads" "$shared/keys"
          ln -sfn "$shared/.env" "$release/.env"
          ln -sfn "$shared/uploads" "$release/uploads"
          if [[ "$require_keys" == true ]]; then
            [[ -f "$shared/keys/private.pem" && -f "$shared/keys/public.pem" ]] || { echo "Put the Asset backend key pair in $shared/keys before deploying."; exit 1; }
            ln -sfn "$shared/keys" "$release/keys"
          fi
          cd "$release"
          npm ci --omit=dev --no-audit --no-fund
          ln -sfn "$release" "$root/current.next"
          mv -Tf "$root/current.next" "$root/current"
          rollback() {
            echo 'Restoring the previous release.'
            if [[ -n "$previous" && -d "$previous" ]]; then
              ln -sfn "$previous" "$root/current.rollback"
              mv -Tf "$root/current.rollback" "$root/current"
              pm2 delete "$app_name" >/dev/null 2>&1 || true
              pm2 start npm --name "$app_name" --cwd "$root/current" -- start || true
            else
              rm -f "$root/current"
              pm2 delete "$app_name" >/dev/null 2>&1 || true
            fi
          }
          pm2 delete "$app_name" >/dev/null 2>&1 || true
          pm2 start npm --name "$app_name" --cwd "$root/current" -- start || { rollback; exit 1; }
          healthy=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 "$health_url" >/dev/null 2>&1; then healthy=true; break; fi
            sleep 3
          done
          if [[ "$healthy" != true ]]; then
            echo 'New release health check failed.'
            rollback
            exit 1
          fi
          pm2 save
          find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | while IFS= read -r old; do
            if [[ -n "$old" && "$old" != "$release" && "$old" != "$previous" ]]; then rm -rf -- "$old"; fi
          done
          echo "Release $release_id deployed and healthy."
          REMOTE_SCRIPT
