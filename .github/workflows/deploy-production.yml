name: Deploy Asset Frontend Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-asset-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, production, asset-frontend]

    env:
      DEPLOY_ROOT: /opt/asset-production/asset-frontend
      PM2_APP_NAME: asset-frontend
      HEALTH_URL: http://127.0.0.1:3005/
      NODE_OPTIONS: --max-old-space-size=2048

    steps:
      # ============================================================
      # 1. CHECK DISK SPACE
      # ============================================================
      - name: Check disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Checking disk space"
          echo "======================================"

          AVAIL_KB=$(df --output=avail / | tail -1)

          echo "Free space: $((AVAIL_KB / 1024)) MB"

          if [ "$AVAIL_KB" -le 3145728 ]; then
            echo "❌ Less than 3GB free on /"
            exit 1
          fi

          echo "✅ Disk space is sufficient"

      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout production package
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            exported/**
            !exported/node_modules/**
            !exported/.env
            !exported/uploads/**
            !exported/.next/cache/**

      # ============================================================
      # 3. CHECK NODE / NPM
      # ============================================================
      - name: Check Node and npm version
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node -v

          echo "npm:"
          npm -v

          echo "Runner:"
          hostname

          echo "User:"
          whoami

      # ============================================================
      # 4. VERIFY PRODUCTION PACKAGE
      # ============================================================
      - name: Verify production package
        shell: bash
        run: |
          set -euo pipefail

          test -d exported
          test -f exported/package.json
          test -f exported/package-lock.json
          test -d exported/.next

          echo "✅ Production frontend package verified"

      # ============================================================
      # 5. PREPARE RELEASE
      # ============================================================
      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          echo "Release ID: $RELEASE_ID"
          echo "Release directory: $RELEASE_DIR"

          mkdir -p "$DEPLOY_ROOT/releases"
          mkdir -p "$DEPLOY_ROOT/shared"

          mkdir -p "$RELEASE_DIR"

          echo "$RELEASE_ID" > "$RUNNER_TEMP/release-id"

      # ============================================================
      # 6. COPY RELEASE
      # ============================================================
      - name: Copy production package
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(cat "$RUNNER_TEMP/release-id")"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          echo "Copying exported package..."

          rsync -a --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='uploads/' \
            --exclude='.next/cache/' \
            exported/ "$RELEASE_DIR/"

          echo "✅ Release copied"

      # ============================================================
      # 7. VERIFY PRODUCTION ENVIRONMENT
      # ============================================================
      - name: Verify production environment
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$DEPLOY_ROOT/shared/.env" ]; then
            echo "❌ Production environment file is missing:"
            echo "$DEPLOY_ROOT/shared/.env"
            echo ""
            echo "Create it on the production VM before deployment."
            exit 1
          fi

          echo "✅ Production .env exists"

      # ============================================================
      # 8. LINK ENVIRONMENT
      # ============================================================
      - name: Configure release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(cat "$RUNNER_TEMP/release-id")"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          ln -sfn \
            "$DEPLOY_ROOT/shared/.env" \
            "$RELEASE_DIR/.env"

          echo "✅ Production environment configured"

      # ============================================================
      # 9. INSTALL PRODUCTION DEPENDENCIES
      # ============================================================
      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(cat "$RUNNER_TEMP/release-id")"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          cd "$RELEASE_DIR"

          npm ci \
            --omit=dev \
            --no-audit \
            --no-fund \
            --fetch-retries=5 \
            --fetch-retry-mintimeout=20000 \
            --fetch-retry-maxtimeout=120000

          echo "✅ Production dependencies installed"

      # ============================================================
      # 10. ACTIVATE RELEASE
      # ============================================================
      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(cat "$RUNNER_TEMP/release-id")"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          PREVIOUS="$(readlink -f "$DEPLOY_ROOT/current" 2>/dev/null || true)"

          echo "$PREVIOUS" > "$RUNNER_TEMP/previous-release"

          ln -sfn "$RELEASE_DIR" "$DEPLOY_ROOT/current.next"
          mv -Tf "$DEPLOY_ROOT/current.next" "$DEPLOY_ROOT/current"

          echo "Current release:"
          readlink -f "$DEPLOY_ROOT/current"

      # ============================================================
      # 11. RESTART PM2
      # ============================================================
      - name: Restart Asset Frontend
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEPLOY_ROOT/current"

          if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_APP_NAME" --update-env
          else
            pm2 start npm \
              --name "$PM2_APP_NAME" \
              --cwd "$DEPLOY_ROOT/current" \
              -- start
          fi

          pm2 save

          echo "======================================"
          echo "PM2 STATUS"
          echo "======================================"

          pm2 status

      # ============================================================
      # 12. HEALTH CHECK
      # ============================================================
      - name: Health check
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=3

          for i in $(seq 1 "$MAX_ATTEMPTS"); do

            echo "Health check attempt $i/$MAX_ATTEMPTS"

            HTTP_CODE=$(curl -s \
              -o /tmp/asset-frontend-health.txt \
              -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              "$HEALTH_URL" || true)

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Asset Frontend is healthy"
              exit 0
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "❌ Asset Frontend health check failed"
          exit 1

      # ============================================================
      # 13. ROLLBACK ON FAILURE
      # ============================================================
      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set +e

          PREVIOUS="$(cat "$RUNNER_TEMP/previous-release" 2>/dev/null || true)"

          echo "======================================"
          echo "Deployment failed"
          echo "Attempting rollback"
          echo "======================================"

          if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then

            ln -sfn "$PREVIOUS" "$DEPLOY_ROOT/current.rollback"
            mv -Tf "$DEPLOY_ROOT/current.rollback" "$DEPLOY_ROOT/current"

            pm2 delete "$PM2_APP_NAME" >/dev/null 2>&1 || true

            pm2 start npm \
              --name "$PM2_APP_NAME" \
              --cwd "$DEPLOY_ROOT/current" \
              -- start

            pm2 save

            echo "✅ Previous release restored"

          else
            echo "No previous release available for rollback"
          fi

          echo ""
          echo "========== PM2 STATUS =========="
          pm2 status || true

          echo ""
          echo "========== PM2 LOGS =========="
          pm2 logs "$PM2_APP_NAME" --lines 100 --nostream || true

      # ============================================================
      # 14. CLEAN OLD RELEASES
      # ============================================================
      - name: Cleanup old releases
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(readlink -f "$DEPLOY_ROOT/current" 2>/dev/null || true)"

          find "$DEPLOY_ROOT/releases" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%T@ %p\n' |
            sort -nr |
            tail -n +6 |
            cut -d' ' -f2- |
            while IFS= read -r OLD_RELEASE; do

              if [ -n "$OLD_RELEASE" ] && [ "$OLD_RELEASE" != "$CURRENT" ]; then
                echo "Removing old release: $OLD_RELEASE"
                rm -rf -- "$OLD_RELEASE"
              fi

            done

          echo "✅ Old releases cleaned"

      # ============================================================
      # 15. FINAL STATUS
      # ============================================================
      - name: Deployment complete
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "✅ ASSET FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Current release:"
          readlink -f "$DEPLOY_ROOT/current"

          pm2 status
